name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ffmpeg 版本号,三段式,如 8.1.2(X.Y.0 对应上游 tag nX.Y)"
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ github.event.inputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@f093f21ca4cfa7c75ccbbc2be54da76a0c7e1f05 # v6
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: artifacts

      - name: 生成sha256
        run: |
          cd artifacts
          sha256sum *.tar.xz > ../ffmpeg-${{ github.event.inputs.version }}.sha256.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@0adea5aa98b89355a3ff602e3f2d18bc4d77e7aa # v2
        with:
          files: |
            artifacts/ffmpeg-*.tar.xz
            ffmpeg-${{ github.event.inputs.version }}.sha256.txt
          tag_name: v${{ github.event.inputs.version }}
